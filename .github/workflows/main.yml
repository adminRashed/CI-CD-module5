name: CI/CD Pipeline (Simple Version)

on:
  push:
    branches: [ "main" ]

jobs:

  # -------------------------
  # Test Job
  # -------------------------
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

  # -------------------------
  # Deploy Job
  # -------------------------
  deploy:
    needs: test
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: npm install

      - name: Deploy App
        run: |
          echo "Deploying to self-hosted server..."
          pm2 restart app || pm2 start app.js --name="app"

